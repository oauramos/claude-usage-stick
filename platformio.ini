; LilyGo T-Display S3 AMOLED (1.91" RM67162, e.g. H712/H713/H705/H681/H717 variants)
; Display is auto-detected at runtime by the LilyGo_AMOLED library.
[env:tdisplay-s3-amoled]
platform = espressif32@6.12.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git
    bodmer/TFT_eSPI@^2.5.31
    bblanchon/ArduinoJson@^7.0.0
    lewisxhe/XPowersLib@^0.2.7
    lewisxhe/SensorLib@^0.2.4

build_flags =
    -DBOARD_TDISPLAY_S3_AMOLED
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DLILYGO_TDISPLAY_AMOLED_SERIES
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=1

; LilyGo T8 ESP32-S2 (1.14" ST7789 135x240 LCD, same panel as the TTGO T-Display).
; No dedicated PlatformIO board def exists — esp32-s2-saola-1 is the generic S2 base.
; USB is a CH340C UART bridge (not native USB CDC), so ARDUINO_USB_CDC_ON_BOOT is left unset.
; Display wiring uses the broken-out FSPI pins (GPIO33-38); CS/MOSI/SCLK/RST are from the
; schematic, DC=37/BL=33 are the two remaining FSPI pins — all verified on hardware.
[env:t8-s2]
platform = espressif32@6.9.0
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = spiffs
board_build.partitions = default.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DBOARD_T8_S2
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=35
    -DTFT_SCLK=36
    -DTFT_CS=34
    -DTFT_DC=37
    -DTFT_RST=38
    -DTFT_BL=33
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DCORE_DEBUG_LEVEL=1

; GeekMagic SmallTV / GIF.TV (ESP8266 ESP-12F, 1.5" 240x240 ST7789, no buttons).
; First ESP8266 target — the platform port lives behind `#ifdef ESP8266` (compat layer,
; BearSSL TLS, rweather/Crypto instead of mbedTLS, LittleFS-backed config). The stock
; USB-C is power-only on most units: flash via a 3.3V USB-UART adapter on the 6 pads
; (GPIO0->GND on power-up for bootloader). Display uses the ESP8266 HSPI fixed pins
; (MOSI=13/SCLK=14); CS/DC/RST/BL are from the hardware doc — VERIFY with a multimeter.
[env:geekmagic-smalltv]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^7.0.0
    rweather/Crypto@^0.4.0

build_flags =
    -DBOARD_GEEKMAGIC_SMALLTV
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=5
    -DTFT_RST=4
    -DTFT_BL=2
    -DTFT_INVERSION_ON
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
